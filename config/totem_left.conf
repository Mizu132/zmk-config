# Prospector settings (Central / Left half only)
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="TOTEM"
